version: '3.8'

networks:
  hotel_network:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecretPassword123!
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - hotel_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotel.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - hotel_network

  app:
    build: ./app
    container_name: hotel_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: SecretPassword123!
      DB_NAME: hotel_db
    depends_on:
      - db
    networks:
      - hotel_network

  nginx:
    image: nginx:alpine
    container_name: hotel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - hotel_network

  prometheus:
    image: prom/prometheus
    container_name: hotel_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hotel_network

  grafana:
    image: grafana/grafana
    container_name: hotel_grafana
    restart: always
    ports:
      - "3001:3000"
    networks:
      - hotel_network

  loki:
    image: grafana/loki:2.9.2
    container_name: hotel_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - hotel_network

  promtail:
    image: grafana/promtail:2.9.2
    container_name: hotel_promtail
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - hotel_network