<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Luxury Hotel - Đặt Phòng Trực Tuyến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        .hero { background: linear-gradient(rgba(26,54,93,0.8), rgba(26,54,93,0.8)), url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1200&q=80'); background-size: cover; color: white; padding: 50px 0; }
        .room-card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .room-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-hotel me-2"></i>GRAND HOTEL</a>
            <span class="navbar-text text-light small"><i class="fa-solid fa-server me-1"></i>Đề 6 - Triển Khai Hệ Thống</span>
        </div>
    </nav>
    <div class="hero text-center mb-4">
        <h2>Hệ Thống Đặt Phòng Khách Sạn Trực Tuyến</h2>
        <p>Đề 6 - Triển Khai và Quản Trị Hệ Thống Phần Mềm</p>
    </div>
    <div class="container mb-5">
        <div class="d-flex justify-content-between mb-4">
            <select id="filterType" class="form-select w-auto" onchange="fetchRooms()">
                <option value="ALL">Tất cả loại phòng</option>
                <option value="Standard Single">Standard Single</option>
                <option value="Deluxe Double">Deluxe Double</option>
                <option value="VIP Suite">VIP Suite</option>
            </select>
            <button class="btn btn-secondary" onclick="openHistoryModal()"><i class="fa-solid fa-list me-1"></i> Quản Lý Đơn Đặt</button>
        </div>
        <div class="row" id="roomContainer"></div>
    </div>

    <!-- Modal Đặt Phòng -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Đặt Phòng: <span id="modalRoomNumber"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookingForm">
                        <input type="hidden" id="modalRoomId">
                        <div class="mb-3"><label>Họ tên *</label><input type="text" class="form-control" id="custName" required></div>
                        <div class="mb-3"><label>SĐT</label><input type="text" class="form-control" id="custPhone"></div>
                        <div class="row">
                            <div class="col-6"><label>Ngày nhận *</label><input type="date" class="form-control" id="checkInDate" required></div>
                            <div class="col-6"><label>Ngày trả *</label><input type="date" class="form-control" id="checkOutDate" required></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="submitBooking()">Xác Nhận</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Lịch Sử -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-secondary text-white"><h5 class="modal-title">Danh Sách Đơn Đặt</h5></div>
                <div class="modal-body p-0">
                    <table class="table mb-0">
                        <thead><tr><th>Mã</th><th>Khách</th><th>Phòng</th><th>Tổng tiền</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let bookingModalObj, historyModalObj;
        document.addEventListener('DOMContentLoaded', () => {
            bookingModalObj = new bootstrap.Modal(document.getElementById('bookingModal'));
            historyModalObj = new bootstrap.Modal(document.getElementById('historyModal'));
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            document.getElementById('checkInDate').value = today;
            document.getElementById('checkOutDate').value = tomorrow;
            fetchRooms();
        });

        async function fetchRooms() {
            const type = document.getElementById('filterType').value;
            const res = await fetch(`/api/rooms?type=${type}`);
            const rooms = await res.json();
            const container = document.getElementById('roomContainer');
            container.innerHTML = '';
            rooms.forEach(r => {
                const isAvail = r.status === 'available';
                container.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card room-card shadow-sm">
                            <img src="${r.image_url}" class="card-img-top" style="height: 180px; object-fit: cover;">
                            <div class="card-body">
                                <h5>Phòng ${r.room_number}</h5>
                                <p class="text-muted small">${r.type}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold text-success">$${r.price}/đêm</span>
                                    ${isAvail 
                                        ? `<button class="btn btn-primary btn-sm" onclick="openBookingModal(${r.id}, '${r.room_number}')">Đặt ngay</button>` 
                                        : `<button class="btn btn-secondary btn-sm" disabled>Đã đặt</button>`}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openBookingModal(id, num) {
            document.getElementById('modalRoomId').value = id;
            document.getElementById('modalRoomNumber').innerText = num;
            bookingModalObj.show();
        }

        async function submitBooking() {
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const roomId = document.getElementById('modalRoomId').value;
            const checkIn = document.getElementById('checkInDate').value;
            const checkOut = document.getElementById('checkOutDate').value;

            if(!name || !checkIn || !checkOut) return alert('Vui lòng điền đủ thông tin');

            await fetch('/api/bookings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ customer_name: name, customer_phone: phone, room_id: parseInt(roomId), check_in: checkIn, check_out: checkOut, total_days: 1 })
            });
            alert('Đặt phòng thành công!');
            bookingModalObj.hide();
            fetchRooms();
        }

        async function openHistoryModal() {
            const res = await fetch('/api/bookings');
            const bookings = await res.json();
            const tbody = document.getElementById('historyTableBody');
            tbody.innerHTML = '';
            bookings.forEach(b => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${b.id}</td>
                        <td>${b.customer_name}</td>
                        <td>Phòng ${b.room_number}</td>
                        <td>$${b.total_price}</td>
                        <td><span class="badge ${b.status === 'CANCELLED' ? 'bg-danger' : 'bg-success'}">${b.status}</span></td>
                        <td>${b.status !== 'CANCELLED' ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking(${b.id})">Hủy</button>` : ''}</td>
                    </tr>
                `;
            });
            historyModalObj.show();
        }

        async function cancelBooking(id) {
            await fetch(`/api/bookings/${id}/cancel`, { method: 'PUT' });
            alert('Đã hủy đơn!');
            openHistoryModal();
            fetchRooms();
        }
    </script>
</body>
</html>
